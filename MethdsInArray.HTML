<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>join() and pop ()</h2>
<P>The join () metho joins array elements into a string and the pop () methid removes the last method from an array. </P>
<p id = "myjoin"></p>
< p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<script>
    var fruits = [ "Banana", "Orange", "Apple", "Mango "];
    document.getElementById("myjoin").innerHTML = fruits.join(" * ")
    document.getElementById("myfirstpop").innerHTML = fruits;
    fruits.pop();
    document.getElementById("mysecondpop").innerHTML = fruits;
    </script>
    </body>
    </html>
